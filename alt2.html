<html lang="en">
<head>

<style>
:root{--water:#70aec9;--dark:#14222d;--light:#ececec;--muted:#80878d;--rule:#b6babc;--green:#16963B;--yellow:#ffcb05;--orange:#d77522;--red:#d05151}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--light);color:var(--dark);font-family:"Helvetica Neue",-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--dark);outline-offset:3px}
.app{max-width:480px;margin:0 auto;background:var(--light);min-height:100vh;overflow:hidden}
/* hero */
.hero{position:relative;margin-top:-30px;height:calc(100vh + 30px);height:calc(100svh + 30px);background:var(--water);overflow:hidden;user-select:none;-webkit-user-select:none}
.hero.busy .hcontent{opacity:.55}
.map{background:#cdd0d1;position:absolute;left:0;top:0;width:100%;height:36%;overflow:hidden;isolation:isolate;-webkit-mask-image:linear-gradient(#000 72%,transparent);mask-image:linear-gradient(#000 72%,transparent)}
.map img{position:absolute;width:128px;height:128px;display:block;max-width:none}
.tint{position:absolute;inset:0;background:#8ED8F8;mix-blend-mode:multiply}
.diag{position:absolute;overflow:visible;pointer-events:none}
.hcontent{position:absolute;left:24px;right:20px;top:216px;transition:opacity .2s}
.badge{display:inline-block;min-width:45px;height:29px;line-height:29px;padding:0 7px;border-radius:5px;background:var(--yellow);color:var(--water);font-size:24px;font-weight:700;text-align:center}
.name{--fs:min(16.4vw,78px);white-space:pre-line;display:block;margin:calc(15px - var(--fs)*.2405 + 2.5px) 0 0;font-size:var(--fs);line-height:calc(var(--fs)*1.17 - 5px);font-weight:700;letter-spacing:-.01em;color:var(--dark);width:100%}
.face{margin-top:4px;font-size:72px;line-height:1;font-weight:700;letter-spacing:-.02em;color:var(--yellow);white-space:nowrap}
.face small{font-size:22px;letter-spacing:0;margin-left:6px}
.wx{display:grid;grid-template-columns:minmax(0,1fr) max-content max-content;column-gap:14px;margin-right:5px;margin-top:2px;color:var(--light);font-weight:400}
.cond{font-size:21px;line-height:1.1;padding-right:6px}
.pop{margin-top:5px;font-size:11px;font-weight:700;letter-spacing:.02em}
.pop b{font-size:22px;font-weight:400;margin-right:1px}
.col .r{display:flex;align-items:baseline;height:24px;margin-bottom:5px}
.col .sl{flex:none;width:32px;display:flex;align-items:center;align-self:center;height:24px}
.col .v{font-size:22px;line-height:24px}
#wspd,#wgst{min-width:2ch;text-align:right;font-variant-numeric:tabular-nums}
.col small{font-size:11px;font-weight:700;margin-left:4px;letter-spacing:.02em;line-height:24px}
.col svg{display:block}
.arr{transition:transform .2s}
.tl{position:absolute;left:24px;bottom:159px;pointer-events:none;color:var(--light)}
.time{font-size:22px;line-height:1;font-weight:400}
.time small{font-size:11px;font-weight:700;margin-left:2px}
.dlab{margin-top:13px;font-size:11.5px;font-weight:700;letter-spacing:.01em;line-height:1}
.chart{position:absolute;left:0;bottom:0;display:block}
.rail{position:absolute;left:0;top:0;pointer-events:none}
.dial{position:absolute;left:0;right:0;bottom:0;height:190px;touch-action:pan-y;cursor:ew-resize}
.msg{margin-top:8px;font-size:12px;font-weight:700;color:var(--dark)}
/* sheet */
.sheet{padding:30px 24px 34px;background:var(--light)}
.sheet h2{margin:0 0 20px;font-size:24px;line-height:1.1;font-weight:700}
.alerts div{font-size:13px;line-height:1.25;font-weight:700;color:var(--red);margin-bottom:12px}
.why{list-style:none;margin:0;padding:0}
.why li{display:flex;gap:12px;align-items:flex-start;font-size:13px;line-height:1.25;margin-bottom:16px}
.why i{flex:none;width:12px;height:12px;border-radius:50%;margin-top:1px}
.ol{margin-top:58px}
.ohd{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:24px}
.ohd div{text-align:center;font-size:12.5px;font-weight:700;padding-bottom:7px;border-bottom:2px solid var(--rule)}
.oday{font-size:17px;font-weight:700;margin:0 0 9px}
.orow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:28px}
.oc{border-top:4px solid var(--rule);padding-top:7px;display:flex;justify-content:space-between;gap:4px;min-width:0}
.oc.past{opacity:.45}
.oc .tx{font-size:11px;line-height:1.16;font-weight:700;min-width:0}
.oc .rb{flex:none;min-width:35px;height:22px;line-height:22px;padding:0 4px;text-align:center;border-radius:5px;color:#fff;font-size:17px;font-weight:700}
/* details */
/* menu */
.menu{position:fixed;inset:0;z-index:20;background:rgba(20,34,45,.97);overflow:auto;-webkit-overflow-scrolling:touch}
.menu[hidden]{display:none}
.menu-in{max-width:480px;margin:0 auto;padding:max(24px,env(safe-area-inset-top)) 24px 40px}
.mclose{display:block;margin:0 0 18px auto;width:44px;height:44px;font-size:34px;line-height:1;color:var(--light);text-align:center}
.menu ul{list-style:none;margin:0;padding:0}
.menu li button{display:block;width:100%;padding:11px 0;font-size:36px;line-height:1.1;font-weight:700;color:var(--light);letter-spacing:-.01em}
.menu li button[aria-current=true]{color:var(--water)}
.menu li button:focus-visible{outline-color:var(--light)}
@media(prefers-reduced-motion:reduce){.arr,.hcontent{transition:none}}
</style>
</head>

      <div class="col">

      </div>
    </div>
    <div class="msg" id="msg" role="status"></div>
  </div>
  <div class="tl"><div class="time" id="time"></div></div>

</section>
<main class="sheet">
  <section aria-labelledby="h-cond"><h2 id="h-cond">Conditions</h2><div class="alerts" id="alerts"></div><ul class="why" id="why"></ul></section>

</main>
</div>

function S(tag,at,text){var e=document.createElementNS('http://www.w3.org/2000/svg',tag);for(var k in at)e.setAttribute(k,at[k]);if(text!=null)e.textContent=text;return e;}

/* ---------- Time (America/New_York) ---------- */
var fmtParts=new Intl.DateTimeFormat('en-US',{timeZone:TZ,hourCycle:'h23',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric',weekday:'short'});
function etp(ms){var o={};fmtParts.formatToParts(new Date(ms)).forEach(function(p){o[p.type]=p.value;});return {y:+o.year,m:+o.month,d:+o.day,h:+o.hour,min:+o.minute,wd:o.weekday};}

/* ---------- Synthetic (modeled) fallback ---------- */
function synthWaves(t){

function synthWind(t){
  var p=etp(t),hr=p.h+p.min/60,day=t/86400e3;
  var morning=(hr<11||hr>=21);
  var v=morning?4+3*Math.sin(day*1.3)+2:8+8*Math.sin((hr-9)/12*Math.PI*0.9)*Math.max(0.5,Math.sin(day*0.8+1.6)+1);

function synthWx(t){

function tideAt(ev,ms){
  if(!ev||ev.length<2)return null;

    if(ms<=ev[i].t){var a=ev[i-1],b=ev[i],f=(ms-a.t)/(b.t-a.t);return a.v+(b.v-a.v)*(1-Math.cos(Math.PI*f))/2;}

function kmBetween(la1,lo1,la2,lo2){var dLa=(la2-la1)*RAD,dLo=(lo2-lo1)*RAD,a=Math.sin(dLa/2)*Math.sin(dLa/2)+Math.cos(la1*RAD)*Math.cos(la2*RAD)*Math.sin(dLo/2)*Math.sin(dLo/2);return 12742*Math.asin(Math.sqrt(a));}

function etToUtc(y,m,d,hh,mm){for(var off=4;off<=5;off++){var ms=Date.UTC(y,m-1,d,hh+off,mm),p=etp(ms);if(p.h===hh&&p.min===mm&&p.d===d)return ms;}return Date.UTC(y,m-1,d,hh+5,mm);}

function parseLocal(t){var m=/(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2})/.exec(t||'');return m?etToUtc(+m[1],+m[2],+m[3],+m[4],+m[5]):NaN;}

function parseMet(txt){

function faceDesc(f){return f<1.5?'Ankle to knee':f<2.5?'Knee to waist':f<3.5?'Waist to chest':f<4.5?'Chest to head':f<6?'Head to overhead':f<8?'Overhead to double':'Double overhead+';}
function faceRange(f){var lo=Math.max(0,Math.round(f*0.8)),hi=Math.max(lo+1,Math.round(f*1.2));return lo+'–'+hi;}
function swellType(p){return p<8?'Wind chop':p<11?'Windswell':p<14?'Groundswell':'Long-period groundswell';}
function ratingColor(r){return r>=3.5?'var(--green)':r>=2.5?'var(--yellow)':'var(--red)';}
function ratingLabel(r){return r<1?'Flat / unsurfable':r<2?'Poor conditions':r<2.5?'Poor to fair':r<3?'Fair conditions':r<3.5?'Fair to good':r<4?'Good conditions':r<4.5?'Very good conditions':'Epic conditions';}
function goOf(r){return r>=3.5?'GO':r>=2.5?'MAYBE':'NO-GO';}
function goCls(g){return g==='GO'?'go':g==='MAYBE'?'maybe':'nogo';}

function rate(sp,hr){
  var off=(sp.facing+180)%360;
  var comps=hr.sw.map(function(s){
    if(!s||!(s.h>0.05))return null;
    var dl=angDiff(s.d,sp.facing),f=dirFactor(dl),h0=s.h/M2FT,L0=1.56*s.p*s.p,Hp=h0*f;
    var hb=0;if(Hp>0.03){hb=0.56*Hp*Math.pow(Hp/L0,-0.2);hb=clamp(hb,Hp*1.0,Hp*1.4);}
    return {s:s,dl:dl,f:f,L0:L0,Hp:Hp,hb:hb*M2FT,shoal:Hp>0.03?hb/Hp:1};
  });
  var face=Math.sqrt(comps.reduce(function(a,c){return a+(c?c.hb*c.hb:0);},0));
  var P=comps[0]||{s:hr.sw[0],dl:angDiff(hr.sw[0].d,sp.facing),f:0,hb:0,Hp:0,L0:1.56*hr.sw[0].p*hr.sw[0].p,shoal:1};
  var wv=hr.wind.v,wg=hr.wind.g,veff=wv+0.25*(wg-wv),dw=angDiff(hr.wind.d,off);
  var wdS=0.5+0.5*Math.cos(dw*RAD);if(dw>120)wdS*=0.6;
  var wsS;
  if(veff<=6.9)wsS=1;
  else if(dw<=60)wsS=veff<=14?1:interp([[14,1],[30,0.35],[40,0.2],[60,0.1]],veff);
  else if(dw<=110)wsS=veff<=8?1:interp([[8,1],[22,0.1],[40,0]],veff);
  else wsS=veff<=7?1:interp([[7,1],[20,0],[40,0]],veff);
  var kill=dw>110&&veff>17.2;
  var ppS=interp([[0,0],[4,0.02],[6,0.15],[8,0.4],[10,0.65],[12,0.85],[13,0.95],[14,1]],P.s.p);
  var pdS=P.f;
  var phS=interp([[0,0],[0.8,0.05],[1.5,0.3],[2,0.5],[3,0.8],[3.5,0.95],[5,1],[6,0.88],[8,0.65],[10,0.4],[13,0.2]],face);
  var S2=comps[1],S3=comps[2],secS,secTxt;
  if(!S2||S2.hb<0.25*Math.max(P.hb,0.1)){secS=0.85;secTxt='clean — secondary swell is minor';}
  else{
    var dd=angDiff(S2.s.d,P.s.d),sp_=S2.s.p<8;
    if(dd<20){secS=0.95;secTxt='secondary '+cp(S2.s.d)+' swell lines up with the primary';}
    else if(dd<40){secS=0.6;secTxt='secondary '+cp(S2.s.d)+' swell adds some crossing texture';}
    else{secS=sp_?0.15:0.4;secTxt='crossing '+cp(S2.s.d)+' '+(sp_?'windswell':'swell')+' is adding cross-chop';}
  }
  if(S3&&S3.hb>0.35*Math.max(P.hb,0.1)&&angDiff(S3.s.d,P.s.d)>40){secS*=0.85;}
  var tl=hr.tide.lvl,band=sp.ideal.band,tS;
  if(tl>=band[0]&&tl<=band[1])tS=1;else{var dist=tl<band[0]?band[0]-tl:tl-band[1];tS=clamp(1-dist/0.5,0.15,1);}
  if(tl<0.05||tl>0.95)tS*=0.85;
  if(hr.tide.rising)tS=Math.min(1,tS+0.05);
  var F=[
   {k:'wd',name:'Wind direction',w:W.wd,s:clamp(wdS,0,1),val:cp(hr.wind.d)+' ('+Math.round(hr.wind.d)+'°)',
     txt:dw<45?cp(hr.wind.d)+' offshore wind is grooming the wave face':dw<100?cp(hr.wind.d)+' cross-shore wind is adding side texture':cp(hr.wind.d)+' onshore wind is pushing the face down'},
   {k:'ws',name:'Wind speed',w:W.ws,s:clamp(wsS,0,1),val:Math.round(wv)+' mph (gust '+Math.round(wg)+')',
     txt:veff<=6.9?'light '+Math.round(wv)+' mph wind keeps the surface glassy':(dw<=60?Math.round(wv)+' mph offshore wind is strong enough to hold up the face':dw<=110?Math.round(wv)+' mph cross-shore wind is bumping up the surface':Math.round(wv)+' mph onshore wind is turning the surface to chop')},
   {k:'pp',name:'Primary swell period',w:W.pp,s:clamp(ppS,0,1),val:f1(P.s.p)+' s',
     txt:P.s.p>=12?'long '+f1(P.s.p)+' s period brings power and well-defined sets':P.s.p>=9?'moderate '+f1(P.s.p)+' s period gives decent push':'short '+f1(P.s.p)+' s period means weak, mushy surf'},
   {k:'pd',name:'Primary swell direction',w:W.pd,s:clamp(pdS,0,1),val:cp(P.s.d)+' ('+Math.round(P.s.d)+'°) Δ'+Math.round(P.dl)+'°',
     txt:P.f>=0.8?cp(P.s.d)+' swell lines up with the coast':P.f>=0.4?cp(P.s.d)+' swell arrives off-angle and loses energy':cp(P.s.d)+' swell is mostly blocked by the coastline'},
   {k:'ph',name:'Primary swell height',w:W.ph,s:clamp(phS,0,1),val:f1(face)+' ft face ('+f1(P.s.h)+' ft open water)',
     txt:face<1?'barely any size reaching the break':face<2?'small '+faceRange(face)+' ft surf is low on push':face<=5.5?faceRange(face)+' ft is a surfable, well-sized wave':face<=8?faceRange(face)+' ft is big and demanding':faceRange(face)+' ft is oversized and prone to closing out'},
   {k:'sec',name:'Secondary swell',w:W.sec,s:clamp(secS,0,1),val:S2&&S2.s.h>0.3?f1(S2.s.h)+' ft @ '+f1(S2.s.p)+' s '+cp(S2.s.d):'minor',txt:secTxt},
   {k:'tide',name:'Tide',w:W.tide,s:clamp(tS,0,1),val:hr.tide.stage+' '+(hr.tide.rising?'rising':'dropping')+' ('+f1(hr.tide.ft)+' ft)',
     txt:(tS>=0.9?hr.tide.stage+' tide ('+(hr.tide.rising?'rising':'dropping')+') sits in this spot’s sweet spot':hr.tide.stage+' tide is outside the ideal window for this spot')}
  ];
  var comp=F.reduce(function(a,f){return a+f.w/100*f.s;},0);
  var rt=comp*5,caps=[];
  if(kill){rt=Math.min(rt,1.5);caps.push('Onshore wind over 15 kts caps the rating at Poor');}
  if(face<1){rt=Math.min(rt,0.5+face*0.5);caps.push('Too small to surf reliably');}
  if(face>12){rt=Math.min(rt,2.0);caps.push('Oversized — closeouts and dangerous');}
  else if(face>9){rt=Math.min(rt,3.5);}
  rt=Math.round(clamp(rt,0,5)*10)/10;
  F.forEach(function(f){f.loss=f.w/100*(1-f.s);f.gain=f.w/100*f.s;f.contrib=f.gain*5;});
  return {rating:rt,go:goOf(rt),label:ratingLabel(rt),face:face,F:F,comps:comps,P:P,caps:caps,kill:kill,dw:dw,off:off,shoal:P.shoal,primary:hr.sw[0]};
}

var CHH=190,CHB=-25,YB=152,BARH=110,TAMP=29,LX=14,stp=5,sel=0,pos=0,tmin=0,tmax=1,dayEls=[];
var DISP={trailer:'Trailer\nPark',ditch:'Ditch\nPlains',white:'White\nSands',napeague:'Napeague\nBeach',georgica:'Georgica\nBeach',gibson:'Gibson\nBeach',sagg:'Sagg\nMain'};
function dn(sp){return DISP[sp.id]||sp.name;}
function dialData(i){return i===D.i0?{x:D.cur,R:D.R}:{x:D.hours[i],R:ratings[i]};}
function dayLabel(ms){return fmtDay(ms).replace(',','').toUpperCase();}
function setHero(on){$('hero').classList.toggle('busy',!!on);}
function render(){
  var sp=D.spot;
  ratings=D.hours.map(function(x){return rate(sp,x);});
  D.R=rate(sp,D.cur);
  sel=D.i0;pos=D.i0;
  setHero(false);$('msg').textContent='';
  placeContent();renderMap();buildChart();renderOutlook();renderDialed();
}
function placeContent(){var g=geo();$('hcontent').style.top=Math.round(g.cy+g.R+1-29)+'px';}
function layout(){if(!D)return;placeContent();renderMap();buildChart();renderDialed();}
function lonLatTile(lat,lon,z){var n=Math.pow(2,z),x=(lon+180)/360*n,la=lat*RAD,y=(1-Math.log(Math.tan(la)+1/Math.cos(la))/Math.PI)/2*n;return {x:x,y:y};}
/* hero fits the visible viewport: the diagram radius is solved so the location/weather stack ends 30 px above the time label (181 = .tl bottom 159 + 22 time line) */
function geo(){
  var hero=$('hero'),W=hero.clientWidth,Hh=hero.clientHeight,nb=$('nameBtn');
  var stack=nb.offsetTop+nb.offsetHeight+4+72+2+87;
  var T=Hh-181-30-stack,R=clamp((T+28)/2.78,W*0.12,W*0.226);
  return {W:W,R:R,cx:W*0.939-R,cy:R*1.78};
}
/* map: ArcGIS light gray canvas, tinted #8ED8F8 (multiply), selected spot centred under the diagram */
function renderMap(){
  var g=geo(),hero=$('hero'),Hm=Math.round(g.cy+g.R+43),sp=D.spot,z=11,TS=128;$('map').style.height=Hm+'px';
  var tp=lonLatTile(sp.lat,sp.lon,z),tx=Math.floor(tp.x),ty=Math.floor(tp.y),fx=tp.x-tx,fy=tp.y-ty;
  var box=$('tiles');clear(box);
  var nl=Math.ceil(g.cx/TS)+1,nr=Math.ceil((g.W-g.cx)/TS)+1,nu=Math.ceil(g.cy/TS)+1,nd=Math.ceil((Hm-g.cy)/TS)+1;
  if(!D.mapRow){D.mapRow={name:'Esri World Light Gray Canvas',role:'Basemap tiles',state:'mod',updated:null,note:'loading…'};D.src.push(D.mapRow);}
  for(var j=-nu;j<=nd;j++)for(var i=-nl;i<=nr;i++){
    var im=document.createElement('img');im.alt='';im.decoding='async';im.referrerPolicy='no-referrer';
    im.style.left=(g.cx+(i-fx)*TS)+'px';im.style.top=(g.cy+(j-fy)*TS)+'px';
    im.addEventListener('load',function(){if(D.mapRow.state!=='ok'){D.mapRow.state='ok';D.mapRow.note='';D.mapRow.updated=Date.now();}});
    im.addEventListener('error',function(){this.style.display='none';});
    im.src='https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/'+z+'/'+(ty+j)+'/'+(tx+i);
    box.appendChild(im);
  }
}
/* wind / swell diagram: wedges point to where wind / swell come FROM */
function wedge(brg,len,half,fill,op){
  var a1=(brg-half)*RAD,a2=(brg+half)*RAD;
  var x1=len*Math.sin(a1),y1=-len*Math.cos(a1),x2=len*Math.sin(a2),y2=-len*Math.cos(a2);
  return S('path',{d:'M0,0 L'+x1+','+y1+' A'+len+','+len+' 0 0 1 '+x2+','+y2+' Z',fill:fill,'fill-opacity':op});
}
function renderDiagram(x){
  var g=geo(),R=g.R,sv=$('diag');clear(sv);
  sv.style.left=(g.cx-R-3)+'px';sv.style.top=(g.cy-R-3)+'px';sv.setAttribute('width',2*R+6);sv.setAttribute('height',2*R+6);sv.setAttribute('viewBox',(-R-3)+' '+(-R-3)+' '+(2*R+6)+' '+(2*R+6));
  var defs=S('defs',{});
  function grad(id,color,stops){var rg=S('radialGradient',{id:id,gradientUnits:'userSpaceOnUse',cx:0,cy:0,r:R});stops.forEach(function(s){rg.appendChild(S('stop',{offset:s[0],'stop-color':color,'stop-opacity':s[1]}));});defs.appendChild(rg);}
  grad('gradWind','#ffffff',[[0,0.95],[0.5,0.7],[1,0]]);
  grad('gradSwell','#14222d',[[0,0.62],[0.55,0.48],[1,0]]);
  sv.appendChild(defs);
  var w=x.wind;
  sv.appendChild(wedge(w.d,R*clamp(0.45+w.g/36,0.45,1),12,'url(#gradWind)',0.55));
  sv.appendChild(wedge(w.d,R*clamp(0.45+w.v/36,0.45,1),8,'url(#gradWind)',1));
  var ops=[1,0.65,0.45];
  for(var i=2;i>=0;i--){var s=x.sw[i];if(!s||!(s.h>0.25))continue;
    sv.appendChild(wedge(s.d,R*clamp(0.35+s.h/7*0.65,0.35,1),clamp(24-s.p*1.4,6,18),'url(#gradSwell)',ops[i]));}
  sv.appendChild(S('circle',{r:R,fill:'none',stroke:'#14222d','stroke-width':2}));
  sv.appendChild(S('circle',{r:R*0.062,fill:'#14222d'}));
  sv.setAttribute('aria-label','Wind from '+cp(w.d)+' at '+Math.round(w.v)+' mph, primary swell from '+cp(x.sw[0].d)+' '+f1(x.sw[0].h)+' ft at '+f1(x.sw[0].p)+' s');
}

  /* truck: own layer moving PAR x faster than the chart (parallax); at the last hour it rests exactly where it would without parallax */
  truckG=S('g',{id:'truckG'});txEnd=LX-(N-0.5)*stp;
  truckG.appendChild(S('image',{href:ART_B,x:LX+187*stt,y:CHH+CHB-th+2,width:tw,height:th}));
  svg.appendChild(truckG);
  dayEls.forEach(function(o){var w=0;try{w=o.t.getComputedTextLength();}catch(_){}o.w=w>0?w:o.t.textContent.length*7.6;});
  var Hh=$('hero').clientHeight,rs=$('rail');rs.setAttribute('width',W);rs.setAttribute('height',Hh);
  /* the sign lives in the top-most (rail) layer so it is in front of everything; it scrolls with the chart via applyPos() */
  if(signEl&&signEl.parentNode)signEl.parentNode.removeChild(signEl);
  signX0=px0-40*sgS+5;
  signEl=S('image',{href:ART_A,x:0,y:Hh-sgH,width:88*sgS,height:sgH});rs.appendChild(signEl);
  applyPos();
}
function applyPos(){
  var g=$('chartScroll');if(!g)return;
  var tx=LX-(pos+0.5)*stp;
  g.setAttribute('transform','translate('+tx+',0)');
  if(signEl)signEl.setAttribute('x',tx+signX0);
  if(truckG)truckG.setAttribute('transform','translate('+(PAR*(tx-txEnd))+',0)');
  /* day labels: stick at the left, pushed out by the next day's label (and back when swiping right) */
  dayEls.forEach(function(o,d){
    var ld=tx+d*24*stp,x=Math.max(24,ld+5);
    var nx=d<dayEls.length-1?tx+(d+1)*24*stp+5:tx+(N-0.5)*stp-2;/* last day is pushed by the pole */
    x=Math.min(x,nx-o.w-10);
    o.t.setAttribute('x',x);
  });
  var hero=$('hero'),Hh=hero.clientHeight,nb=$('nameBtn'),top=nb.getBoundingClientRect().top-hero.getBoundingClientRect().top+10;
  var dy=Hh-CHH-CHB+tideY(D.start+pos*HR);
  var l=$('rline');l.setAttribute('x1',LX);l.setAttribute('x2',LX);l.setAttribute('y1',top);l.setAttribute('y2',dy);
  var c=$('rdot');c.setAttribute('cx',LX);c.setAttribute('cy',dy);
}
function setPos(p){
  pos=clamp(p,0,N-1);applyPos();
  var i=Math.round(pos);
  if(i!==sel){sel=i;renderDialed();}
}
/* the dialed hour drives everything above and below the chart */
function renderDialed(){
  var d=dialData(sel),x=d.x,R=d.R,sp=D.spot,col=ratingColor(R.rating),ms=D.hours[sel].t;
  var b=$('badge');b.textContent=f1(R.rating);b.style.background=col;
  $('nameTxt').textContent=dn(sp);$('nameBtn').setAttribute('aria-label','Change location. Selected: '+sp.name);
  var fc=$('face');clear(fc);fc.style.color=col;fc.appendChild(document.createTextNode(faceRange(R.face).replace('–','-')));fc.appendChild(h('small',null,'FT'));
  $('cond').textContent=condText(x);$('pop').textContent=Math.round(x.pop||0);
  $('air').textContent=Math.round(x.airF)+'°';$('sst').textContent=Math.round(x.sstF)+'°';
  $('wspd').textContent=Math.round(x.wind.v);$('wgst').textContent=Math.round(Math.max(x.wind.g,x.wind.v));
  $('warr').style.transform='rotate('+x.wind.d+'deg)';
  var s0=x.sw[0];$('sper').textContent=f1(s0.p);$('sht').textContent=f1(s0.h);$('sarr').style.transform='rotate('+s0.d+'deg)';
  var tm=fmtT(ms,false).split(/[\s ]+/),tl=$('time');clear(tl);tl.appendChild(document.createTextNode(tm[0]));if(tm[1])tl.appendChild(h('small',null,tm[1]));
  var dl=$('dial');dl.setAttribute('aria-valuenow',sel);dl.setAttribute('aria-valuetext',fmtWd(ms)+' '+fmtT(ms,false)+', rating '+f1(R.rating));
  renderDiagram(x);renderWhy(R);
  applyPos();
}
function renderWhy(R){
  var al=$('alerts');clear(al);D.alerts.forEach(function(t){al.appendChild(h('div',null,'⚠ '+t));});
  var ul=$('why');clear(ul);
  function row(c,t){var li=h('li'),i=h('i');i.style.background=c;add(li,i,h('span',null,t));ul.appendChild(li);}
  if(R.kill)row('var(--red)','Kill switch: onshore wind over 15 kts caps the rating at Poor');
  R.F.slice().sort(function(a,b){return b.loss-a.loss;}).filter(function(f){return f.loss>=0.025;}).slice(0,2).forEach(function(f){row('var(--red)','Limited by '+f.name.toLowerCase()+': '+f.txt);});
  var boost=R.F.slice().sort(function(a,b){return b.gain-a.gain;}).filter(function(f){return f.s>=0.8;}).slice(0,2);
  boost.forEach(function(f){row('var(--green)','Helped by '+f.name.toLowerCase()+': '+f.txt);});
  if(!ul.children.length)row('var(--green)','Balanced conditions across all factors');
  R.caps.forEach(function(c){if(!R.kill||c.indexOf('Onshore')<0)row('var(--red)',c);});
}
function renderOutlook(){
  var o=$('outlook');clear(o);
  for(var d=0;d<6;d++){
    var dayMs=D.start+d*24*HR;
    o.appendChild(h('div','oday',d===0?'Today':new Intl.DateTimeFormat('en-US',{timeZone:TZ,weekday:'long'}).format(new Date(dayMs+12*HR))));
    var row=h('div','orow');
    [6,12,18].forEach(function(hr){
      var i=d*24+hr,r=ratings[i],x=D.hours[i],col=ratingColor(r.rating),cell=h('div','oc'+(i<D.i0?' past':'')),tx=h('div','tx'),rb=h('div','rb',f1(r.rating));
      cell.style.borderTopColor=col;rb.style.background=col;
      add(tx,h('div',null,faceRange(r.face)+' FT'),h('div',null,Math.round(x.wind.v)+' MPH '+cp(x.wind.d)),h('div',null,f1(x.sw[0].p)+'s '+cp(x.sw[0].d)),h('div',null,'TIDE '+x.tide.stage.toUpperCase()+' '+(x.tide.rising?'↑':'↓')));
      add(cell,tx,rb);row.appendChild(cell);
    });
    o.appendChild(row);
  }
}
function condText(c){
  if(c.cond)return c.cond;
  var p=etp(c.t),night=p.h<6||p.h>=19;
  return c.sky<20?(night?'Clear':'Sunny'):c.sky<50?'Partly Cloudy':c.sky<80?'Mostly Cloudy':'Overcast';
}

/* ---------- Interaction ---------- */
var drag=null,raf=0;
function initDial(){
  var dl=$('dial');
  dl.addEventListener('pointerdown',function(e){cancelAnimationFrame(raf);drag={x:e.clientX,p:pos,lx:e.clientX,lt:e.timeStamp,v:0};try{dl.setPointerCapture(e.pointerId);}catch(_){}});
  dl.addEventListener('pointermove',function(e){
    if(!drag||!D)return;
    setPos(drag.p-(e.clientX-drag.x)/stp);
    var dt=e.timeStamp-drag.lt;if(dt>0){drag.v=0.7*drag.v+0.3*((drag.lx-e.clientX)/stp)/dt;}
    drag.lx=e.clientX;drag.lt=e.timeStamp;
  });
  function end(){
    if(!drag)return;var v=drag.v;drag=null;
    var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
    function snap(){var tgt=Math.round(pos),k=0;(function s(){k++;setPos(pos+(tgt-pos)*0.4);if(Math.abs(tgt-pos)>0.01&&k<20)raf=requestAnimationFrame(s);else setPos(tgt);})();}
    function step(){
      if(!reduce&&Math.abs(v)>0.002){setPos(pos+v*16);v*=0.93;if(pos>0&&pos<N-1){raf=requestAnimationFrame(step);return;}}
      snap();
    }
    step();
  }
  dl.addEventListener('pointerup',end);dl.addEventListener('pointercancel',end);
  dl.addEventListener('keydown',function(e){
    var d=e.key==='ArrowRight'||e.key==='ArrowUp'?1:e.key==='ArrowLeft'||e.key==='ArrowDown'?-1:e.key==='PageUp'?24:e.key==='PageDown'?-24:0;
    if(d&&D){e.preventDefault();setPos(Math.round(pos)+d);}
  });
}
function initMenu(){
  var m=$('menu'),ul=$('mlist'),btn=$('nameBtn');
  function close(){m.hidden=true;document.body.style.overflow='';btn.focus();}
  function open(){
    clear(ul);
    SPOTS.forEach(function(s){var li=document.createElement('li'),b=h('button',null,dn(s).replace('\n',' '));b.type='button';if(s.id===spot.id)b.setAttribute('aria-current','true');
      b.addEventListener('click',function(){var changed=s.id!==spot.id;spot=s;m.hidden=true;document.body.style.overflow='';if(changed){$('nameTxt').textContent=dn(s);setHero(true);load();}btn.focus();});
      li.appendChild(b);ul.appendChild(li);});
    m.hidden=false;document.body.style.overflow='hidden';var cu=ul.querySelector('[aria-current]')||ul.querySelector('button');if(cu)cu.focus();
  }
  btn.addEventListener('click',open);$('mclose').addEventListener('click',close);
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!m.hidden)close();});
}
/* ---------- Init ---------- */
function init(){
  $('nameTxt').textContent=dn(spot);
  initDial();initMenu();
  var rt;window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(layout,150);});
  setInterval(function(){if(!document.hidden&&!drag)load();},15*60*1000);
  load();
}
init();
})();
</script>
